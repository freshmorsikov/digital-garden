<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06131d">
  <title>Particle animation</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { background: #06131d; overflow: hidden; }
    main { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: 1fr 1fr; }
    .visual { position: relative; min-width: 0; min-height: 100vh; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; position: absolute; inset: 0; cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      .visual { min-height: 50vh; }
    }
  </style>
</head>
<body>
  <main>
    <div></div>
    <div class="visual" aria-hidden="true"><canvas></canvas></div>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector('canvas');
      const context = canvas.getContext('2d');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const points = [];
      function makeGlow(center, middle, edge) {
        const sprite = document.createElement('canvas');
        sprite.width = sprite.height = 32;
        const spriteContext = sprite.getContext('2d');
        const glow = spriteContext.createRadialGradient(16, 16, 0, 16, 16, 16);
        glow.addColorStop(0, center);
        glow.addColorStop(0.45, middle);
        glow.addColorStop(0.7, edge);
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        spriteContext.fillStyle = glow;
        spriteContext.fillRect(0, 0, 32, 32);
        return sprite;
      }
      const glowSprites = [
        makeGlow('rgba(205, 250, 255, 1)', 'rgba(0, 210, 245, 0.95)', 'rgba(0, 145, 220, 0.5)'),
        makeGlow('rgba(255, 220, 250, 1)', 'rgba(255, 80, 205, 0.95)', 'rgba(255, 30, 170, 0.65)'),
        makeGlow('rgba(205, 225, 255, 1)', 'rgba(50, 125, 245, 0.95)', 'rgba(25, 75, 205, 0.5)')
      ];
      const count = 26000;
      const goldenAngle = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < count; i++) {
        const y = 1 - (i / (count - 1)) * 2;
        const ring = Math.sqrt(1 - y * y);
        const angle = goldenAngle * i;
        // Small, stable offsets break up the regular sphere without making it flicker.
        const jitter = () => (Math.random() - 0.5) * 0.025;
        const x = Math.cos(angle) * ring + jitter();
        const shiftedY = y + jitter();
        const z = Math.sin(angle) * ring + jitter();
        // Anchor the color patches to the surface so they move with the cloud.
        // Broad irregular bands, with a few sparse pink sparks embedded in them.
        const band = shiftedY + 0.25 * Math.sin(x * 4 + z * 3) + 0.12 * Math.sin(z * 9 - x * 5);
        const pinkArea = Math.hypot(x + 0.38, shiftedY - 0.32, z - 0.82) < 0.34 + 0.06 * Math.sin(x * 17 + shiftedY * 19);
        const layer = 0.68 + 0.32 * Math.pow(Math.random(), 0.55);
        points.push({
          x,
          y: shiftedY,
          z,
          layer,
          offsetX: 0,
          offsetY: 0,
          phase: Math.random() * Math.PI * 2,
          brightness: 0.4 + Math.random() * 0.6,
          size: 0.45 + Math.pow(Math.random(), 3) * 1.1,
          variation: Math.floor(Math.random() * 5),
          speed: 0.6 + Math.random() * 0.7,
          color: pinkArea && Math.random() < 0.22 ? 1 : band > 0.32 ? 2 : 0
        });
      }

      let width = 0, height = 0, animation, lastFrameTime;
      const pointer = { x: -1000, y: -1000, active: false, dragging: false, lastX: 0, lastY: 0 };
      let dragYaw = 0, dragPitch = 0;
      let targetYaw = 0, targetPitch = 0;
      canvas.addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        pointer.dragging = true;
        pointer.active = false;
        pointer.lastX = event.clientX;
        pointer.lastY = event.clientY;
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener('pointermove', event => {
        if (pointer.dragging) {
          targetYaw += (event.clientX - pointer.lastX) * 0.003;
          targetPitch -= (event.clientY - pointer.lastY) * 0.003;
          pointer.lastX = event.clientX;
          pointer.lastY = event.clientY;
          if (reducedMotion.matches) draw(0);
          return;
        }
        const bounds = canvas.getBoundingClientRect();
        pointer.x = event.clientX - bounds.left;
        pointer.y = event.clientY - bounds.top;
        pointer.active = true;
        if (reducedMotion.matches) draw(0);
      });
      function stopDragging(event) {
        pointer.dragging = false;
        if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
        if (reducedMotion.matches) draw(0);
      }
      canvas.addEventListener('pointerup', stopDragging);
      canvas.addEventListener('pointercancel', stopDragging);
      canvas.addEventListener('pointerleave', () => {
        pointer.active = false;
        if (reducedMotion.matches) draw(0);
      });
      function resize() {
        const bounds = canvas.getBoundingClientRect();
        width = bounds.width;
        height = bounds.height;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        if (reducedMotion.matches) draw(0);
      }
      function draw(time) {
        context.clearRect(0, 0, width, height);
        const delta = lastFrameTime === undefined ? 16 : Math.min(Math.max(time - lastFrameTime, 0), 50);
        lastFrameTime = time;
        const easing = reducedMotion.matches ? 1 : 1 - Math.exp(-delta / 350);
        const rotationEase = reducedMotion.matches ? 1 : 1 - Math.exp(-delta / (pointer.dragging ? 100 : 220));
        dragYaw += (targetYaw - dragYaw) * rotationEase;
        dragPitch += (targetPitch - dragPitch) * rotationEase;
        const t = time * 0.00018;
        const compositionWidth = Math.max(width, height * 0.72);
        const radius = Math.min(compositionWidth * 0.67, height * 0.48);
        const centerX = Math.max(compositionWidth * 0.57, radius * 1.25 + 8);
        const centerY = height * 0.53;
        const rotation = t * 0.65 + dragYaw;
        const cos = Math.cos(rotation), sin = Math.sin(rotation);
        const pitchCos = Math.cos(dragPitch), pitchSin = Math.sin(dragPitch);
        for (const point of points) {
          // Animate the folds in the cloud's own space, independently of its orientation.
          const { x: baseX, y: baseY, z: baseZ } = point;
          const fold = 1 + 0.07 * Math.sin(baseY * 6 + baseX * 4 + t * 2)
            + 0.045 * Math.sin(baseX * 9 - baseZ * 5 + baseY * 5 - t * 2)
            + 0.03 * Math.cos(baseZ * 11 + baseY * 9 + t * 3);
          const waveX = baseX * fold * point.layer + 0.035 * Math.sin(baseY * 8 + baseZ * 5 + t);
          const waveY = baseY * fold * point.layer + 0.035 * Math.sin(baseX * 6 + baseZ * 4 - t);
          const waveZ = baseZ * fold * point.layer;
          // Turn the already-animated cloud as a whole when the pointer drags it.
          const x = waveX * cos - waveZ * sin;
          const rotatedZ = waveX * sin + waveZ * cos;
          const y = waveY * pitchCos - rotatedZ * pitchSin;
          const z = waveY * pitchSin + rotatedZ * pitchCos;
          const perspective = 1 / (1.9 - z * 0.24);
          let px = centerX + x * radius * perspective * 1.8;
          let py = centerY + y * radius * perspective * 1.8;
          let targetX = 0, targetY = 0;
          if (pointer.active && z > 0) {
            const dx = px - pointer.x;
            const dy = py - pointer.y;
            const distanceSquared = dx * dx + dy * dy;
            const reach = 240;
            if (distanceSquared < reach * reach) {
              // Expand the local field smoothly, without clearing its center.
              const falloff = 1 - distanceSquared / (reach * reach);
              const expansion = 0.65 * falloff * falloff;
              targetX = dx * expansion;
              targetY = dy * expansion;
            }
          }
          if (z > 0) {
            point.offsetX += (targetX - point.offsetX) * easing;
            point.offsetY += (targetY - point.offsetY) * easing;
            px += point.offsetX;
            py += point.offsetY;
          } else {
            point.offsetX = point.offsetY = 0;
          }
          const brightness = Math.max(0.12, (z + 1.5) / 2.5);
          const change = 0.5 + 0.5 * Math.sin(point.phase + t * point.speed * 4);
          let lightScale = 1;
          let sizeScale = 1;
          if (point.variation === 1) lightScale = 1 + 0.5 * change;
          if (point.variation === 2) lightScale = 1 - 0.55 * change;
          if (point.variation === 3) sizeScale = 1 + 0.5 * change;
          if (point.variation === 4) sizeScale = 1 - 0.45 * change;
          // Front-facing particles stand out; those behind recede into the cloud.
          const depth = Math.max(0, Math.min(1, (z + 1) / 2));
          const alpha = Math.min(1, brightness * point.brightness * lightScale * (0.8 + depth * 0.4));
          const size = (0.65 + brightness * 0.8) * point.size * sizeScale * (0.9 + depth * 0.45) * 1.25;
          context.globalAlpha = alpha;
          context.drawImage(glowSprites[point.color], px - size, py - size, size * 2, size * 2);
        }
        context.globalAlpha = 1;
      }
      function animate(time) {
        draw(time);
        animation = requestAnimationFrame(animate);
      }
      function setMotion() {
        cancelAnimationFrame(animation);
        lastFrameTime = undefined;
        if (reducedMotion.matches) draw(0);
        else animation = requestAnimationFrame(animate);
      }
      window.addEventListener('resize', resize);
      reducedMotion.addEventListener('change', setMotion);
      resize();
      setMotion();
    })();
  </script>
</body>
</html>
